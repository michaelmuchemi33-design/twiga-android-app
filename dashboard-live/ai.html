<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Talk with AI · TWIGA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#F47721;--ink:#111;--muted:#6B6863;--line:#E7E5E2;--soft:#F6F6F5;--orange-soft:#FEEFE3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif;padding:env(safe-area-inset-top) 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:11px;padding:8px 2px 12px;border-bottom:1px solid var(--line)}
.mark{width:38px;height:38px;border-radius:11px;background:var(--orange);display:grid;place-items:center;font:800 23px Manrope,sans-serif}
.brand{font:800 17px Manrope,sans-serif;letter-spacing:2px}.eyebrow{font-size:10px;letter-spacing:1px;color:var(--muted)}
h1{font:800 25px/1.2 Manrope,sans-serif;margin:4px 0}
.sub{color:var(--muted);font-size:13px}
.card{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}
.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;max-width:100%;flex:1;min-width:120px}
.status{display:inline-flex;align-items:center;border-radius:99px;background:var(--orange-soft);padding:5px 10px;font-size:12px;font-weight:700}
button{font:700 15px Manrope,sans-serif;cursor:pointer}
.btn{width:100%;border:0;background:var(--orange);color:var(--ink);border-radius:12px;padding:15px;box-shadow:0 2px 0 var(--ink)}
.btn:active{transform:translateY(1px);box-shadow:none}.btn:disabled{opacity:.6}
#tr{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:190px;max-height:45vh;display:grid;gap:8px;align-content:start;overflow:auto}
.m{max-width:90%;padding:9px 12px;border-radius:13px;overflow-wrap:anywhere;white-space:pre-wrap}
.a{background:#fff;border:1px solid #e7e5e2;justify-self:start}.u{background:var(--ink);color:#fff;justify-self:end}
.err{color:#B42318;font-size:13px;min-height:18px}
</style>
</head>
<body>
<header><div class="mark">T</div><div><div class="brand">TWIGA</div><div class="eyebrow">AI RECEPTIONIST</div></div></header>
<section><h1>Talk with your AI.</h1><div class="sub" id="who">Test how your receptionist answers your customers.</div></section>
<section class="card">
  <div class="controls">
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="sw">Kiswahili (beta)</option></select>
    <select id="voice" aria-label="Voice"></select>
    <span class="status" id="st">Ready</span>
  </div>
  <div style="height:12px"></div>
  <button class="btn" id="go">Start talking</button>
  <div class="err" id="err" role="alert"></div>
</section>
<div id="tr" aria-live="polite"><div class="sub">Your conversation will appear here.</div></div>
<script src="config.js"></script>
<script type="module">
import { createCall, VOICES } from "/vapi-call.js";
const K = window.TWIGA_CONFIG || {}, $ = id => document.getElementById(id);
const p = new URLSearchParams(location.hash.slice(1)), token = p.get("t") || "", biz = p.get("n") || "your business";
$("who").textContent = "Testing the receptionist for " + biz + ".";
VOICES.forEach(v => { const o = document.createElement("option"); o.value = v[0]; o.textContent = v[1]; $("voice").appendChild(o); });
let ai = {}, call = null;
async function loadAi() {
  const local = window.TWIGA_LOCAL;
  if (local && (local.prompt || local.faq || local.rules)) { ai = local; return; }
  if (!token) return;
  try {
    const r = await fetch(K.supabaseUrl + "/rest/v1/rpc/device_get_ai", {
      method: "POST",
      headers: { apikey: K.supabaseKey, "Content-Type": "application/json" },
      body: JSON.stringify({ p_token: token })
    });
    if (r.ok) {
      const data = await r.json();
      ai = Array.isArray(data) ? (data[0] || {}) : (data || {});
    } else {
      $("err").textContent = "Could not load your saved AI settings. Check the phone pairing and internet connection.";
    }
  } catch (e) {
    $("err").textContent = "Could not load your saved AI settings. Check the internet connection.";
  }
}
const labels = { connecting: "Connecting", listening: "Listening", speaking: "Speaking", ended: "Ready" };
function state(s) {
  $("st").textContent = labels[s] || "Ready";
  $("go").disabled = s === "connecting";
  $("go").textContent = s === "listening" || s === "speaking" ? "End call" : s === "connecting" ? "Connecting..." : "Start talking";
}
function line(role, text) {
  const safe = typeof text === "string" ? text : "";
  if (!safe.trim()) return;
  const t = $("tr");
  if (t.querySelector(".sub")) t.innerHTML = "";
  const d = document.createElement("div");
  d.className = "m " + (role === "user" ? "u" : "a");
  d.textContent = safe;
  t.appendChild(d);
  t.scrollTop = t.scrollHeight;
}
$("go").addEventListener("click", async () => {
  if (call && call.live) { call.stop(); return; }
  $("err").textContent = "";
  await loadAi();
  call = createCall(K.vapiKey, {
    state, line,
    error: e => { $("err").textContent = typeof e === "string" ? e : "The AI call could not start. Please try again."; state("ended"); }
  });
  call.start({ name: biz, prompt: ai.prompt, faq: ai.faq, rules: ai.rules, greeting: ai.greeting, voice: $("voice").value, lang: $("lang").value, maxSeconds: 300 });
});
</script>
</body>
</html>
