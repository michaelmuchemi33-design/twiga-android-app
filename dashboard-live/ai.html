<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI receptionist</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{font:15px/1.5 Poppins,system-ui,sans-serif;color:#111;background:#fff;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));min-height:100vh;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px}.sub{color:#667085;font-size:13px}
.card{border:1px solid #111;border-radius:20px;box-shadow:0 3px 0 #111;padding:16px}
select{font:inherit;border:1px solid #111;border-radius:12px;padding:9px 12px;background:#fff;max-width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{width:100%;border:1px solid #111;background:#F47721;border-radius:99px;padding:16px;font:700 16px Poppins,sans-serif;box-shadow:0 2px 0 #111}
.btn:active{transform:translateY(2px);box-shadow:none}.btn[disabled]{opacity:.6}
.chip{display:inline-block;border:1px solid #111;border-radius:99px;padding:2px 12px;font-size:12px;font-weight:600}
#tr{background:#F6F6F5;border-radius:14px;padding:12px;min-height:160px;display:grid;gap:8px;align-content:start;flex:1;overflow:auto}
.m{max-width:90%;padding:8px 12px;border-radius:14px}.a{background:#fff;border:1px solid #ddd}.u{background:#111;color:#fff;justify-self:end}
.err{color:#C23B2E;font-size:13px}
</style></head><body>
<div><h1>AI receptionist</h1><div class="sub" id="who">Test how your AI answers your customers.</div></div>
<div class="card">
  <div class="row">
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="sw">Kiswahili (beta)</option></select>
    <select id="voice" aria-label="Voice"></select>
    <span class="chip" id="st">Ready</span>
  </div>
  <button class="btn" id="go">Start talking</button>
  <div class="err" id="err" role="alert"></div>
</div>
<div id="tr" aria-live="polite"><div class="sub">The conversation will appear here.</div></div>
<script src="config.js"></script>
<script type="module">
import { createCall, VOICES } from "/vapi-call.js";
const K = window.TWIGA_CONFIG || {}, $ = id => document.getElementById(id);
const p = new URLSearchParams(location.hash.slice(1)), token = p.get("t") || "", biz = p.get("n") || "your business";
$("who").textContent = "Test how your AI answers customers for " + biz + ".";
VOICES.forEach(v => { const o = document.createElement("option"); o.value = v[0]; o.textContent = v[1]; $("voice").appendChild(o); });
let ai = {}, call = null;
async function loadAi() {
  if (!token) return;
  try {
    const r = await fetch(K.supabaseUrl + "/rest/v1/rpc/device_get_ai", { method: "POST", headers: { apikey: K.supabaseKey, "Content-Type": "application/json" }, body: JSON.stringify({ p_token: token }) });
    if (r.ok) ai = await r.json();
  } catch (e) {}
}
const label = { connecting: "Connecting", listening: "Listening", speaking: "Speaking", ended: "Ready" };
function state(s) { $("st").textContent = label[s] || s; $("go").disabled = s === "connecting"; $("go").textContent = s === "listening" || s === "speaking" ? "End call" : s === "connecting" ? "Connecting..." : "Start talking"; }
function line(role, text) { const t = $("tr"); if (t.querySelector(".sub")) t.innerHTML = ""; const d = document.createElement("div"); d.className = "m " + (role === "user" ? "u" : "a"); d.textContent = text; t.appendChild(d); t.scrollTop = t.scrollHeight; }
$("go").addEventListener("click", async () => {
  if (call && call.live) { call.stop(); return; }
  $("err").textContent = "";
  await loadAi();
  call = createCall(K.vapiKey, { state, line, error: e => { $("err").textContent = e; state("ended"); } });
  call.start({ name: biz, prompt: ai.prompt, greeting: ai.greeting, voice: $("voice").value, lang: $("lang").value, maxSeconds: 300 });
});
</script></body></html>
