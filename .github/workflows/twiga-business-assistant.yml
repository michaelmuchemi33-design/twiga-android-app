name: TWIGA Business Assistant Android
on:
  push:
    branches: [feature/twiga-business-assistant-app]
    paths:
      - "business-assistant/**"
      - ".github/workflows/twiga-business-assistant.yml"
  pull_request:
    paths:
      - "business-assistant/**"
      - ".github/workflows/twiga-business-assistant.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set unique app version for this build
        run: |
          VERSION_CODE=$((400000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          echo "ORG_GRADLE_PROJECT_appVersionCode=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_appVersionName=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "TWIGA_APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "TWIGA_APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - name: Build separate Business Assistant APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon -p business-assistant :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: twiga-business-assistant-debug-apk
          path: business-assistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare permanent Android release signing
        if: ${{ secrets.TWIGA_ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          TWIGA_ANDROID_KEYSTORE_BASE64: ${{ secrets.TWIGA_ANDROID_KEYSTORE_BASE64 }}
          TWIGA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TWIGA_ANDROID_KEYSTORE_PASSWORD }}
          TWIGA_ANDROID_KEY_ALIAS: ${{ secrets.TWIGA_ANDROID_KEY_ALIAS }}
          TWIGA_ANDROID_KEY_PASSWORD: ${{ secrets.TWIGA_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$TWIGA_ANDROID_KEYSTORE_PASSWORD"
          test -n "$TWIGA_ANDROID_KEY_ALIAS"
          test -n "$TWIGA_ANDROID_KEY_PASSWORD"
          echo "$TWIGA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/twiga-release.jks"
          test -s "$RUNNER_TEMP/twiga-release.jks"
          echo "TWIGA_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/twiga-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ secrets.TWIGA_ANDROID_KEYSTORE_BASE64 != '' }}
        run: ./gradlew --no-daemon -p business-assistant :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: ${{ secrets.TWIGA_ANDROID_KEYSTORE_BASE64 != '' }}
        with:
          name: twiga-business-assistant-signed-release-apk
          path: business-assistant/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Keep the previous public APK until permanent signing is configured
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/twiga-business-assistant-app' && secrets.TWIGA_ANDROID_KEYSTORE_BASE64 == '' }}
        run: echo "No permanent signing key configured. Skipping public release replacement to avoid publishing a debug-signed update."
      - name: Publish latest TWIGA Business Assistant APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/twiga-business-assistant-app' && secrets.TWIGA_ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          APK_SOURCE="business-assistant/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_SOURCE"
          cp "$APK_SOURCE" release-assets/twiga-business-assistant.apk
          APK_SIZE=$(stat -c%s release-assets/twiga-business-assistant.apk)
          APK_SHA=$(sha256sum release-assets/twiga-business-assistant.apk | cut -d' ' -f1)
          cat > release-assets/version.json <<EOF
          {
            "appId": "co.ke.twiga.businessassistant",
            "versionName": "$TWIGA_APP_VERSION_NAME",
            "versionCode": $TWIGA_APP_VERSION_CODE,
            "sizeBytes": $APK_SIZE,
            "sha256": "$APK_SHA",
            "minimumAndroidSdk": 24,
            "minimumAndroidVersion": "7.0",
            "sourceBranch": "$GITHUB_REF_NAME",
            "sourceCommit": "$GITHUB_SHA",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          TAG="twiga-business-assistant-latest"
          TITLE="TWIGA Business Assistant $TWIGA_APP_VERSION_NAME"
          NOTES="Latest TWIGA Business Assistant Android build.\n\nVersion: $TWIGA_APP_VERSION_NAME ($TWIGA_APP_VERSION_CODE)\nMinimum Android: 7.0 (API 24)\nSHA-256: $APK_SHA\n\nThe TWIGA website reads this release automatically. This APK is signed with the permanent TWIGA release key."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/twiga-business-assistant.apk release-assets/version.json --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" release-assets/twiga-business-assistant.apk release-assets/version.json --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/twiga-business-assistant.apk"
