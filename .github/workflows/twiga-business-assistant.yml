name: TWIGA Business Assistant Android
on:
  push:
    branches: [feature/twiga-business-assistant-app]
    paths:
      - "business-assistant/**"
      - ".github/workflows/twiga-business-assistant.yml"
  pull_request:
    paths:
      - "business-assistant/**"
      - ".github/workflows/twiga-business-assistant.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build separate Business Assistant APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon -p business-assistant :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: twiga-business-assistant-debug-apk
          path: business-assistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
