name: TWIGA Android CI

on:
  push:
    branches: [ main, feature/native-app-matches-web-phone-workspace ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish this signed APK to the public latest-apk download"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared TWIGA workspace JavaScript
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path("dashboard-live/app.html").read_text()
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, flags=re.I | re.S)
          scripts = [script for script in scripts if script.strip()]
          if not scripts:
              raise SystemExit("No inline dashboard scripts found")
          out = pathlib.Path("/tmp/twiga-dashboard-scripts")
          out.mkdir(exist_ok=True)
          for index, script in enumerate(scripts):
              (out / f"inline-{index}.js").write_text(script)
          print(f"Extracted {len(scripts)} inline script blocks")
          PY
          for file in /tmp/twiga-dashboard-scripts/*.js; do node --check "$file"; done
          for file in dashboard-live/*.js; do [ -f "$file" ] && node --check "$file"; done
          node --input-type=module --check < cloudflare-worker/index.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Accept Android SDK licences and install Android 17 SDK 37.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Require permanent signing key before publishing
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Refusing to publish an APK signed with an ephemeral debug key."
            echo "Configure the permanent ANDROID_KEYSTORE_BASE64 and related signing secrets."
            exit 1
          fi

      - name: Prepare signing key and build number
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "ORG_GRADLE_PROJECT_appVersionCode=$((400000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/twiga.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/twiga.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Run tests and build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Validate optimized release APK (PR testing only)
        if: github.event_name == 'pull_request'
        run: ./gradlew --no-daemon assembleRelease

      - name: Build optimized release APK
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK (testing)
        uses: actions/upload-artifact@v4
        with:
          name: twiga-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload optimized release APK (PR testing)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: twiga-release-test-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload optimized release APK
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: actions/upload-artifact@v4
        with:
          name: twiga-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish optimized APK download
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk twiga.apk
          CODE=$((400000 + GITHUB_RUN_NUMBER))
          SIZE=$(stat -c%s twiga.apk)
          printf '{"build": %s, "size": %s, "apk": "https://github.com/%s/releases/download/latest-apk/twiga.apk"}' "$CODE" "$SIZE" "$GITHUB_REPOSITORY" > version.json
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk twiga.apk version.json --clobber
            gh release edit latest-apk --title "TWIGA - Latest Android APK" --notes "TWIGA Android release. Build: $CODE. Signed with the permanent TWIGA release key."
          else
            gh release create latest-apk twiga.apk version.json --title "TWIGA - Latest Android APK" --notes "TWIGA Android release. Build: $CODE. Signed with the permanent TWIGA release key." --prerelease
          fi
