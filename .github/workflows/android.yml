name: Unity AI Receptionist Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Accept Android SDK licences and install Android 17 SDK 37.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Run tests and build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Build optimized release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK (testing)
        uses: actions/upload-artifact@v4
        with:
          name: unity-ai-receptionist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: unity-ai-receptionist-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish optimized APK download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk unity-ai-receptionist.apk
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk unity-ai-receptionist.apk --clobber
            gh release edit latest-apk --title "Unity AI Receptionist - Latest Optimized APK" --notes "Optimized R8 release build for device testing. This build uses the Android debug signing key because no private production keystore is configured. Configure a private signing keystore before public production distribution."
          else
            gh release create latest-apk unity-ai-receptionist.apk --title "Unity AI Receptionist - Latest Optimized APK" --notes "Optimized R8 release build for device testing. This build uses the Android debug signing key because no private production keystore is configured. Configure a private signing keystore before public production distribution." --prerelease
          fi
